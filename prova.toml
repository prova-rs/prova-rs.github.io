[requires]
prova = ">= 0.16"

# The bar this site holds itself to. `prova` before you push runs what CI runs,
# so the answer to "will CI accept this?" is available before the commit exists.
#
# Dogfooding is the secondary point. The primary one is that every proof here
# encodes a defect this repo actually shipped at least once.
#
# "Same bar" holds only while the BINARIES match. CI pins a release (see
# .github/workflows/deploy.yml); a `cargo install --git` build now reports
# `+dev.<sha>` so the two are at least distinguishable — `prova --version` and
# `prova.version` both show it. To check a change against exactly what CI runs:
#
#   gh release download <tag> --repo prova-rs/prova --pattern '*macos-arm64*'

[run]
proofs = ["proofs"]
jobs = 4

# Deliberately no base `must_run`. Guarantees are unioned into EVERY profile and
# can never be subtracted, so a base guarantee has to be true of every run this
# package can perform — and `--profile nightly` only reads version strings, with
# no reason to own a toolchain. node and pnpm were once guaranteed here and the
# nightly job failed on the union, which is the rule working, not fighting us.
#
# On a laptop a missing pnpm SHOULD skip the build proofs visibly: that is what
# a test's `requires` is for. Turning that skip into a failure is policy about
# an environment, so it belongs to the profile that makes the promise.

# The merge gate. Everything the proofs here gate on, guaranteed — a runner that
# lost one FAILS rather than quietly dropping that coverage and reporting green.
[profiles.ci]
must_run = ["node", "pnpm", "python3", "file"]

# Network-touching checks, run on a schedule rather than in the merge gate — a docs build should
# not go red because GitHub is slow. `proofs` is a directory-NAME pattern, so naming `nightly`
# here selects exactly that directory and the default run never sees it.
[profiles.nightly]
proofs = ["nightly"]
must_run = ["gh"]
