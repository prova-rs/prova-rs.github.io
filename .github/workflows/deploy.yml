name: Proofs & Deploy

# One pipeline, one bar. `prova` here is the same command against the same
# prova.toml a developer runs before committing, so the question "will CI accept
# this?" is answerable locally — that is the whole point of putting the
# requirements in proofs/ rather than in steps here.
#
# Proofs gate the deploy rather than running beside it. That matters because
# this repo pushes straight to main routinely: a pull-request-only check would
# have covered almost nothing.
#
# The proofs run `pnpm build` themselves, so the artifact uploaded below is the
# very one they just verified — not a second, unproven build of the same commit.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      # The proofs shell out to the real pnpm commands, so the workspace has to
      # be installed before prova runs.
      - run: pnpm install --frozen-lockfile

      - uses: prova-rs/run-action@v1
        with:
          version: v0.11.0

      - name: Upload the proven build
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: proofs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
