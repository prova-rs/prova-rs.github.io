name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'minor_release'
        type: choice
        options:
          - minor_release
          - major_branch

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are how the action finds the current version

      # Calls the composite action directly. The previous `uses:` pointed at
      # archetect-actions/repository-release/.github/workflows/release.yaml@v1,
      # which cannot work: at v1 that file is release.yml, and it declares only
      # `on: workflow_dispatch` — a reusable workflow needs `on: workflow_call`.
      # This mirrors what that workflow does internally.
      - uses: archetect-actions/repository-release@v1
        with:
          release_type: ${{ github.event.inputs.release_type }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
