<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Prova mark, FAILING state — same brackets, same stroke grammar as
       logo.svg, opposite verdict: an X where the checkmark goes, red where
       the emerald goes. Used as the navbar logo in dark mode. -->
  <defs>
    <!-- Mirrors logo.svg: anchored on the dark-mode text value (red-400), one
         step deeper toward the top right. The stops run light to dark, the
         opposite of the passing mark, because this one is read against a dark
         navbar — what "high contrast at bottom left" means inverts with the
         ground. Matching logo.svg's literal dark-to-light order would sink the
         mark's corner into the navbar. -->
    <linearGradient id="f" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#f)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- brackets: an executable expression -->
    <path d="M42 26 L22 26 L22 102 L42 102"/>
    <path d="M86 26 L106 26 L106 102 L86 102"/>
    <!-- the refutation: an X -->
    <path d="M46 46 L82 82"/>
    <path d="M82 46 L46 82"/>
  </g>
</svg>
