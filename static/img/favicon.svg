<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Prova favicon, self-switching on the OS color scheme: passing (emerald
       check) in light, failing (red X) in dark. This is the declared favicon
       and the no-JS baseline; src/clientModules/faviconState.ts overrides it
       with favicon-pass.svg / favicon-fail.svg when the reader toggles the
       site theme away from their OS preference. -->
  <style>
    .tile { fill: #059669; }
    .fail { display: none; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #ef4444; }
      .pass { display: none; }
      .fail { display: inline; }
    }
  </style>
  <rect class="tile" width="128" height="128" rx="24"/>
  <g fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path class="pass" d="M40 66 L56 86 L90 40"/>
    <path class="fail" d="M42 42 L86 86"/>
    <path class="fail" d="M86 42 L42 86"/>
  </g>
</svg>
